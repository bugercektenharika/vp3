<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burdur Vetpet</title>
<link rel="icon" href="img/logo.png" type="image/png">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
   :root {
      --navy: #161a66;
      --navy-dark: #0e1147;
      --navy-soft: #3d4199;
      --accent: #1fa971;
      --accent-dark: #148055;
      --accent-soft: #d9f5e6;
      --bg-tint: #eef0fb;
      --bg-tint-2: #f7f8fd;
      --gray-300: #dfe1ef;
      --text-muted: #5b5e79;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --shadow-soft: 0 24px 48px -20px rgba(22, 26, 102, 0.28);
      --shadow-card: 0 14px 34px -18px rgba(22, 26, 102, 0.22);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
   }

   * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
   }

   html, body {
      height: 100%;
   }

   body {
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-tint-2);
      background-image: url(img/background.png);
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
   }

   .maintenance-card {
      position: relative;
      width: 100%;
      max-width: 620px;
      background-color: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 56px 44px;
      text-align: center;
      overflow: hidden;
   }



   .maintenance-card > * {
      position: relative;
      z-index: 1;
   }

   #logo {
      width: 130px;
      background-color: white;
      border-radius: 20%;
      box-shadow: var(--shadow-card);
      margin-bottom: 28px;
   }

   .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-dark);
      background-color: var(--accent-soft);
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
   }

   .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-dark);
      display: inline-block;
   }

   h1 {
      font-size: 34px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.15;
      margin-bottom: 16px;
   }

   p {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-muted);
      max-width: 460px;
      margin: 0 auto 28px;
   }

   .contact-info {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
   }

   .contact-info a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background-color: var(--navy);
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 14px 30px -12px rgba(22, 26, 102, 0.55);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background-color 0.35s var(--ease);
   }

   .contact-info a:hover {
      transform: translateY(-3px);
      background-color: var(--accent);
      box-shadow: 0 18px 34px -10px rgba(22, 26, 102, 0.55);
   }

   .paws {
      margin-top: 32px;
      font-size: 13px;
      color: var(--gray-300);
      color: #9a9dc2;
   }

   @media only screen and (max-width: 480px) {
      .maintenance-card {
         padding: 40px 24px;
      }

      h1 {
         font-size: 26px;
      }

      p {
         font-size: 14px;
      }

      #logo {
         width: 100px;
      }
   }
</style>
</head>
<body>

   <div class="maintenance-card">
      <img id="logo" src="img/logo.png" alt="Paw Care Logo">
      <h1>Şu anda bakımdayız</h1>
      <p>Sistemi daha iyi hale getirmek için kısa bir bakım çalışması yürütüyoruz. En kısa sürede tekrar hizmetinizdeyiz. Anlayışınız için teşekkür ederiz.</p>

      <div class="contact-info">
         <a href="https://www.instagram.com/vetpetveterinerpoliklinigi/"><i class="fa-brands fa-instagram"></i> Instagram</a>
      </div>

      <div class="paws">Burdur Vetpet &copy 2026</div>
   </div>

</body>
</html>
